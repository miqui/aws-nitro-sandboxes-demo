name: ci

# Keyless: no AWS credentials, no secrets. Nothing is ever planned or applied.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false

      - name: tofu fmt
        working-directory: infra
        run: tofu fmt -check -recursive

      - name: tofu init (no backend)
        working-directory: infra
        run: tofu init -backend=false -input=false

      - name: tofu validate
        working-directory: infra
        run: tofu validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.66.0

      - name: tflint
        working-directory: infra
        env:
          GITHUB_TOKEN: ${{ github.token }} # only to avoid rate limits when downloading the ruleset
        run: |
          tflint --init
          tflint --format compact

      - name: shellcheck
        run: find . -name '*.sh' -not -path './infra/.terraform/*' -print0 | xargs -0 shellcheck -x

      - name: bash -n
        run: find . -name '*.sh' -not -path './infra/.terraform/*' -print0 | xargs -0 -n1 bash -n

      - name: IaC policy tests
        working-directory: infra
        run: bash tests/policy_test.sh

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: unit tests
        run: python3 -m unittest discover -v

      - name: bundle dry-run
        run: scripts/build-bundle.sh --dry-run --kernel-url https://example.invalid/bzImage --rootfs-url https://example.invalid/rootfs.squashfs

      - name: run-sandbox dry-run
        run: python3 app/bin/run-sandbox app/samples/hello.py --dry-run
